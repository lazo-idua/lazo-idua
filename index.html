<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TD MELNYK</title>
    <link rel="icon" href="https://lazo-idua.github.io/lazo-idua/Logo.png" type="image/png">
    <link rel="apple-touch-icon" href="https://lazo-idua.github.io/lazo-idua/Logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --app-height: 100vh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            background: #000;
            touch-action: manipulation;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overscroll-behavior: contain;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .loader img {
            width: 80px;
            height: 80px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            color: #fff;
            padding: 10px 20px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            -webkit-app-region: drag;
        }

        .header-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
        }

        .header-logo img {
            height: 40px;
            margin-right: 10px;
        }

        .header-buttons {
            display: flex;
            gap: 15px;
        }

        .header-buttons .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .header-buttons .menu-btn:hover {
            color: #aaa;
        }

        #mainMenu {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 80px; /* Виправлено: додано відступ, щоб контент не перекривався шапкою */
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #mainTooltip {
            position: absolute;
            top: 75px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            z-index: 90;
            transition: opacity 1s ease;
            white-space: nowrap;
            display: none;
        }

        #pdfSelection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .pdf-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #fff;
            text-decoration: none;
        }

        .pdf-item:hover {
            transform: translateY(-5px);
        }

        .pdf-thumbnail {
            width: 100%;
            padding-top: 141.42%; /* 210 / 297 A4 ratio */
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .pdf-thumbnail .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            position: absolute;
            display: none;
        }

        .pdf-thumbnail.loading .loading-spinner {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pdf-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            line-height: 1.2;
        }

        .pdf-name {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        #pdfHeader {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #111;
            color: #fff;
            padding: 10px 20px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            -webkit-app-region: drag;
        }

        #pdfHeader button, #pdfHeader a {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 5px;
        }

        #pdfHeader button.active {
            color: #ffcc00;
        }

        #pdfHeader #pdfTitle {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        #mainContent {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: calc(100% - 60px);
            margin-top: 60px;
            position: relative;
            overflow: hidden;
        }

        .pdf-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            touch-action: pan-y pinch-zoom;
        }

        .pdf-container #pdf-canvas,
        .pdf-container #pdf-canvas-next {
            display: block;
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }
        .pdf-container #pdf-canvas.high-quality {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .pdf-container #pdf-canvas-next {
            opacity: 0;
            z-index: 1;
        }

        .pdf-container #pdf-canvas.canvas-hidden {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .pdf-container .high-quality {
            image-rendering: auto;
        }

        .navigation-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 15px 10px;
            cursor: pointer;
            z-index: 50;
            transition: background 0.2s ease, opacity 0.2s ease;
            height: 100%;
            width: 50px;
            max-height: calc(100% - 60px);
        }

        .navigation-btn:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .navigation-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #prevBtn {
            left: 0;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        #nextBtn {
            right: 0;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        .error-message {
            color: white;
            text-align: center;
            font-size: 1.2rem;
        }

        .error-message small {
            font-size: 0.9rem;
            color: #aaa;
        }

        #favoritesModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
        }

        .favorites-header {
            width: 100%;
            background: #222;
            color: #fff;
            padding: 15px;
            text-align: center;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .favorites-header h2 {
            font-size: 1.2rem;
        }

        .close-favorites-btn, .clear-favorites-btn, .close-favorites-view-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-favorites-btn {
            right: 15px;
        }

        .clear-favorites-btn {
            left: 15px;
        }

        #favoritesListView {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            flex: 1;
        }

        .favorite-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 150px;
            cursor: pointer;
            position: relative;
        }

        .favorite-thumbnail {
            width: 100%;
            padding-top: 141.42%;
            background: #444;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .favorite-info {
            color: #fff;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .remove-favorite-x {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .remove-favorite-x::after {
            content: '×';
        }

        .remove-favorite-x:hover {
            background: rgba(255, 0, 0, 0.7);
        }

        #favoritesContentView {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .favorites-canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            touch-action: pan-y pinch-zoom;
        }

        .favorites-canvas-container #favorites-canvas,
        .favorites-canvas-container #favorites-canvas-next {
            display: block;
            width: auto;
            height: auto;
            max-width: none;
            max-height: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .favorites-canvas-container .navigation-btn {
            z-index: 1010;
        }

        .favorites-controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 15px;
            z-index: 1020;
        }
        .favorites-controls button {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 767px) {
            #pdfSelection {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .navigation-btn {
                width: 30px;
                font-size: 1.5rem;
            }
            #pdfHeader button, #pdfHeader a {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="loader">
        <img src="https://lazo-idua.github.io/lazo-idua/Logo.png" alt="Loading">
    </div>
    <header id="header">
        <div class="header-logo">
            <img src="https://lazo-idua.github.io/lazo-idua/Logo.png" alt="Логотип">
            TD MELNYK
        </div>
        <div class="header-buttons">
            <button class="menu-btn" onclick="openFavoritesModal()">Обрані</button>
        </div>
    </header>

    <main id="mainMenu">
        <div id="mainTooltip">Гортай вправо, щоб вибрати</div>
        <div id="pdfSelection"></div>
    </main>

    <header id="pdfHeader">
        <button id="backBtn" onclick="goBackToMainMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-left"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="pdfTitle"></span>
        <div>
            <button id="pdfFavoriteBtn" onclick="toggleFavorite()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-heart"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
            <button id="pdfShareBtn" onclick="sharePage()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-share-2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
        </div>
    </header>

    <main id="mainContent">
        <div class="pdf-container">
            <canvas id="pdf-canvas"></canvas>
            <canvas id="pdf-canvas-next"></canvas>
            <button id="prevBtn" class="navigation-btn" onclick="prevPage()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-left"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button id="nextBtn" class="navigation-btn" onclick="nextPage()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-right"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </main>

    <div id="favoritesModal">
        <div class="favorites-header">
            <h2>Обрані</h2>
            <button class="close-favorites-btn" onclick="closeFavoritesModal()">&times;</button>
        </div>
        <div id="favoritesListView"></div>
        <div id="favoritesContentView">
            <div class="favorites-canvas-container">
                <canvas id="favorites-canvas"></canvas>
                <canvas id="favorites-canvas-next"></canvas>
                <button class="navigation-btn favorites-prev-btn" onclick="prevFavoritePage()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-left"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button class="navigation-btn favorites-next-btn" onclick="nextFavoritePage()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-right"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
            <div class="favorites-controls">
                <button onclick="removeCurrentFavorite()">Видалити</button>
                <button onclick="closeFavoritesView()">Закрити</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let favoritesMode = false;
        let currentPdf = '';
        let currentScale = 1.0;
        const canvas = document.getElementById('pdf-canvas');
        const canvasNext = document.getElementById('pdf-canvas-next');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const ctxNext = canvasNext.getContext('2d', { willReadFrequently: true });
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pdfHeader = document.getElementById('pdfHeader');
        const pdfTitle = document.getElementById('pdfTitle');
        const pdfFavoriteBtn = document.getElementById('pdfFavoriteBtn');
        const pdfShareBtn = document.getElementById('pdfShareBtn');
        const mainMenu = document.getElementById('mainMenu');
        const mainContent = document.getElementById('mainContent');
        const mainHeader = document.getElementById('header');
        const pdfSelection = document.getElementById('pdfSelection');
        const mainTooltip = document.getElementById('mainTooltip');
        const favoritesModal = document.getElementById('favoritesModal');
        const favoritesListView = document.getElementById('favoritesListView');
        const favoritesContentView = document.getElementById('favoritesContentView');
        const favoritesCanvas = document.getElementById('favorites-canvas');
        const favoritesCanvasNext = document.getElementById('favorites-canvas-next');
        const favoritesCtx = favoritesCanvas.getContext('2d', { willReadFrequently: true });
        const favoritesCtxNext = favoritesCanvasNext.getContext('2d', { willReadFrequently: true });
        const favoritesPrevBtn = document.querySelector('.favorites-prev-btn');
        const favoritesNextBtn = document.querySelector('.favorites-next-btn');
        const backBtn = document.getElementById('backBtn');

        let favoritePages = JSON.parse(localStorage.getItem('favoritePages')) || {};
        let currentFavoriteIndex = 0;
        let favoriteItems = [];

        const isMobile = window.innerWidth <= 767;
        let renderQuality = isMobile ? Math.min(window.devicePixelRatio || 1, 2.5) : Math.min(window.devicePixelRatio || 1, 1.5);
        const preloadNextPages = isMobile ? 1 : 3;

        const isLargeScreen = window.innerWidth >= 1200;
        const pageCache = new Map();
        const favoritesPageCache = new Map();

        const catalogs = [
            { name: 'gadassa', url: 'https://lazo-idua.github.io/lazo-idua/gadassa.pdf' },
            { name: 'медуня', url: 'https://lazo-idua.github.io/lazo-idua/medunia.pdf' },
            { name: 'добрий вечір', url: 'https://lazo-idua.github.io/lazo-idua/dobryi_vechir.pdf' },
            { name: 'biscotti', url: 'https://lazo-idua.github.io/lazo-idua/biscotti.pdf' },
            { name: 'rsv', url: 'https://lazo-idua.github.io/lazo-idua/rsv.pdf' },
            { name: 'балу', url: 'https://lazo-idua.github.io/lazo-idua/balu.pdf' },
            { name: 'тест', url: 'https://lazo-idua.github.io/lazo-idua/medunia.pdf' }
        ];

        function hideTooltips() {
            setTimeout(() => {
                if (mainTooltip) {
                    mainTooltip.style.opacity = '0';
                    mainTooltip.style.display = 'none';
                }
            }, 15000);
        }

        function openFavoritesModal() {
            favoritesModal.style.display = 'flex';
            renderFavoritesList();
        }

        function closeFavoritesModal() {
            favoritesModal.style.display = 'none';
            favoritesContentView.style.display = 'none';
            favoritesListView.style.display = 'flex';
        }

        function closeFavoritesView() {
            favoritesContentView.style.display = 'none';
            favoritesListView.style.display = 'flex';
        }

        function renderFavoritesList() {
            favoritesListView.innerHTML = '';
            favoriteItems = [];

            for (const pdfName in favoritePages) {
                favoritePages[pdfName].forEach(page => {
                    const item = document.createElement('div');
                    item.classList.add('favorite-item');
                    item.onclick = () => openFavoritePdf(pdfName, page);
                    const thumbnail = document.createElement('div');
                    thumbnail.classList.add('favorite-thumbnail');
                    thumbnail.innerHTML = `<div class="thumbnail-placeholder">${pdfName.toUpperCase()}<br>Сторінка ${page}</div>`;
                    const info = document.createElement('div');
                    info.classList.add('favorite-info');
                    info.textContent = `${pdfName.toUpperCase()} - Сторінка ${page}`;
                    const removeBtn = document.createElement('button');
                    removeBtn.classList.add('remove-favorite-x');
                    removeBtn.onclick = (e) => { e.stopPropagation(); removeGlobalFavorite(pdfName, page); };
                    item.appendChild(thumbnail);
                    item.appendChild(info);
                    item.appendChild(removeBtn);
                    favoritesListView.appendChild(item);

                    favoriteItems.push({ pdfName, page });
                });
            }
        }

        function openFavoritePdf(pdfName, page) {
            currentFavoriteIndex = favoriteItems.findIndex(item =>
                item.pdfName === pdfName && item.page === page
            );

            if (currentFavoriteIndex === -1) return;

            favoritesListView.style.display = 'none';
            favoritesContentView.style.display = 'flex';

            loadFavoritePdf(pdfName, page);
        }

        function loadFavoritePdf(pdfName, page) {
            const url = getPdfUrl(pdfName);
            if (!url) return;

            favoritesCtx.clearRect(0, 0, favoritesCanvas.width, favoritesCanvas.height);
            favoritesCtxNext.clearRect(0, 0, favoritesCanvasNext.width, favoritesCanvasNext.height);
            favoritesCanvas.width = 0;
            favoritesCanvas.height = 0;
            favoritesCanvasNext.width = 0;
            favoritesCanvasNext.height = 0;

            pdfjsLib.getDocument({
                url: url,
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true,
                maxImageSize: isIOS ? 4096 * 4096 : 8192 * 8192,
                disableFontFace: true,
                standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',
                useSystemFonts: true,
                isEvalSupported: false,
                disableRange: isIOS,
                disableStream: isIOS
            }).promise.then(function(pdf) {
                renderFavoritePage(pdf, page);
                updateFavoritesNavigation();
            }).catch(function(error) {
                console.error(`Помилка завантаження PDF ${pdfName}:`, error);
            });
        }

        function renderFavoritePage(pdf, pageNum) {
            pdf.getPage(pageNum).then(function(page) {
                const scale = calculateOptimalScale(page);
                const viewport = page.getViewport({ scale: scale });

                const maxWidth = isIOS ? 4096 : 8192;
                const maxHeight = isIOS ? 4096 : 8192;

                let outputScale = Math.min(renderQuality, maxWidth / viewport.width, maxHeight / viewport.height);
                outputScale = Math.min(outputScale, isIOS ? 1.8 : 2.5);

                favoritesCanvas.width = Math.floor(viewport.width * outputScale);
                favoritesCanvas.height = Math.floor(viewport.height * outputScale);

                favoritesCanvas.style.width = Math.floor(viewport.width) + 'px';
                favoritesCanvas.style.height = Math.floor(viewport.height) + 'px';

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                const renderContext = {
                    canvasContext: favoritesCtx,
                    viewport: viewport,
                    transform: transform,
                    enableWebGL: !isIOS,
                    textLayer: false,
                    enhanceTextSelection: false,
                    useDisplayValues: true
                };

                page.render(renderContext).promise.then(function() {
                    favoritesCanvas.classList.add('high-quality');
                    updateFavoritesNavigation();
                }).catch(function(error) {
                    console.error(`Помилка рендерингу сторінки ${pageNum}:`, error);
                });
            }).catch(function(error) {
                console.error(`Помилка завантаження сторінки ${pageNum}:`, error);
            });
        }

        function updateFavoritesNavigation() {
            favoritesPrevBtn.disabled = currentFavoriteIndex <= 0;
            favoritesNextBtn.disabled = currentFavoriteIndex >= favoriteItems.length - 1;
        }

        function prevFavoritePage() {
            if (currentFavoriteIndex <= 0) return;
            currentFavoriteIndex--;
            const favorite = favoriteItems[currentFavoriteIndex];
            loadFavoritePdf(favorite.pdfName, favorite.page);
        }

        function nextFavoritePage() {
            if (currentFavoriteIndex >= favoriteItems.length - 1) return;
            currentFavoriteIndex++;
            const favorite = favoriteItems[currentFavoriteIndex];
            loadFavoritePdf(favorite.pdfName, favorite.page);
        }

        function removeCurrentFavorite() {
            if (currentFavoriteIndex >= 0 && currentFavoriteIndex < favoriteItems.length) {
                const favorite = favoriteItems[currentFavoriteIndex];
                removeGlobalFavorite(favorite.pdfName, favorite.page);

                favoriteItems.splice(currentFavoriteIndex, 1);

                if (favoriteItems.length === 0) {
                    closeFavoritesView();
                    renderFavoritesList();
                } else {
                    if (currentFavoriteIndex >= favoriteItems.length) {
                        currentFavoriteIndex = favoriteItems.length - 1;
                    }
                    if (currentFavoriteIndex >= 0) {
                        const nextFavorite = favoriteItems[currentFavoriteIndex];
                        loadFavoritePdf(nextFavorite.pdfName, nextFavorite.page);
                    } else {
                        closeFavoritesView();
                        renderFavoritesList();
                    }
                }
            }
        }

        function removeGlobalFavorite(pdfName, page) {
            favoritePages[pdfName] = favoritePages[pdfName].filter(p => p !== page);
            if (favoritePages[pdfName].length === 0) delete favoritePages[pdfName];
            localStorage.setItem('favoritePages', JSON.stringify(favoritePages));
            renderFavoritesList();
        }

        function clearGlobalFavorites() {
            if (confirm('Ви впевнені, що хочете видалити всі обрані малюнки?')) {
                favoritePages = {};
                localStorage.setItem('favoritePages', JSON.stringify(favoritePages));
                renderFavoritesList();
                if (favoritesContentView.style.display === 'flex') {
                    closeFavoritesView();
                }
            }
        }

        async function checkPdfAvailability(url) {
            try {
                const response = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
                return response.ok;
            } catch {
                return false;
            }
        }

        function getPdfUrl(pdfName) {
            const pdfUrls = {};
            catalogs.forEach(catalog => {
                pdfUrls[catalog.name] = catalog.url;
            });
            return pdfUrls[pdfName] || '';
        }

        function generateThumbnail(pdfName, thumbnailId) {
            const url = getPdfUrl(pdfName);
            if (!url) return;

            const thumbnailContainer = document.getElementById(thumbnailId);
            if (!thumbnailContainer) return;
            thumbnailContainer.classList.add('loading');

            checkPdfAvailability(url).then(isAvailable => {
                if (!isAvailable) {
                    console.error(`PDF ${pdfName} недоступний за URL: ${url}`);
                    thumbnailContainer.classList.remove('loading');
                    thumbnailContainer.innerHTML = `<div class="thumbnail-placeholder">Помилка завантаження<br>${pdfName.toUpperCase()}</div>`;
                    return;
                }

                const loadingTask = pdfjsLib.getDocument({
                    url: url,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    cMapPacked: true,
                    maxImageSize: 2048 * 2048,
                    disableFontFace: true,
                    standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',
                    isEvalSupported: false,
                    useSystemFonts: true
                });

                loadingTask.promise.then(function(pdf) {
                    pdf.getPage(1).then(function(page) {
                        const viewport = page.getViewport({ scale: 1.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d', { willReadFrequently: true });
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };

                        page.render(renderContext).promise.then(function() {
                            const img = document.createElement('img');
                            img.src = canvas.toDataURL('image/jpeg', 0.9);
                            img.onload = function() {
                                thumbnailContainer.innerHTML = '';
                                thumbnailContainer.appendChild(img);
                                thumbnailContainer.classList.remove('loading');
                            };
                        }).catch(function(error) {
                            console.error(`Помилка рендерингу мініатюри для ${pdfName}:`, error);
                            thumbnailContainer.classList.remove('loading');
                            thumbnailContainer.innerHTML = `<div class="thumbnail-placeholder">Помилка завантаження<br>${pdfName.toUpperCase()}</div>`;
                        });
                    }).catch(function(error) {
                        console.error(`Помилка завантаження сторінки для мініатюри ${pdfName}:`, error);
                        thumbnailContainer.classList.remove('loading');
                        thumbnailContainer.innerHTML = `<div class="thumbnail-placeholder">Помилка завантаження<br>${pdfName.toUpperCase()}</div>`;
                    });
                }).catch(function(error) {
                    console.error(`Помилка завантаження PDF для мініатюри ${pdfName}:`, error);
                    thumbnailContainer.classList.remove('loading');
                    thumbnailContainer.innerHTML = `<div class="thumbnail-placeholder">Помилка завантаження<br>${pdfName.toUpperCase()}</div>`;
                });
            });
        }

        function openPdf(pdfName) {
            currentPdf = pdfName;
            mainMenu.style.display = 'none';
            mainHeader.style.display = 'none';
            pdfHeader.style.display = 'flex';
            mainContent.style.display = 'flex';
            backBtn.style.display = 'flex';
            pdfTitle.textContent = pdfName.toUpperCase();
            mainContent.classList.add('opening');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctxNext.clearRect(0, 0, canvasNext.width, canvasNext.height);
            canvas.width = 0;
            canvas.height = 0;
            canvasNext.width = 0;
            canvasNext.height = 0;
            pageCache.clear();
            loadPdf();
            hideTooltips();
        }

        function goBackToMainMenu() {
            mainMenu.style.display = 'flex';
            mainContent.style.display = 'none';
            mainHeader.style.display = 'flex';
            pdfHeader.style.display = 'none';
            backBtn.style.display = 'none';
            mainContent.classList.remove('opening');
            pageRendering = false;
            pageNumPending = null;
            pageCache.clear();
            pdfDoc = null;
            pageNum = 1;
            favoritesMode = false;
            currentScale = 1.0;
            updateNavigation();
            updateFavoriteButton();
            hideTooltips();
        }

        function calculateOptimalScale(page) {
            const container = document.querySelector('.pdf-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const viewport = page.getViewport({ scale: 1 });
            const scaleX = containerWidth / viewport.width;
            const scaleY = containerHeight / viewport.height;
            let scale = Math.min(scaleX, scaleY);
            return scale;
        }

        function loadPdf() {
            const url = getPdfUrl(currentPdf);
            if (!url) {
                mainContent.innerHTML = `
                    <div class="error-message">
                        <p>Помилка: PDF не знайдено</p>
                        <small>Перевірте URL каталогу ${currentPdf.toUpperCase()}</small>
                    </div>
                `;
                updateNavigation();
                hideTooltips();
                return;
            }

            checkPdfAvailability(url).then(isAvailable => {
                if (!isAvailable) {
                    mainContent.innerHTML = `
                        <div class="error-message">
                            <p>Не вдалося завантажити каталог ${currentPdf.toUpperCase()}</p>
                            <small>PDF недоступний. Перевірте URL або підключення до інтернету.</small>
                        </div>
                    `;
                    console.error(`PDF ${currentPdf} недоступний за URL: ${url}`);
                    updateNavigation();
                    hideTooltips();
                    return;
                }

                pdfjsLib.getDocument({
                    url: url,
                    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                    cMapPacked: true,
                    maxImageSize: isMobile ? 4096 * 4096 : 8192 * 8192,
                    disableFontFace: true,
                    standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',
                    useSystemFonts: true,
                    isEvalSupported: false,
                    disableRange: isIOS,
                    disableStream: isIOS
                }).promise.then(function(pdf) {
                    pdfDoc = pdf;
                    renderPage(pageNum);
                    preloadPages(pageNum + 1, preloadNextPages + 2);
                    updateNavigation();
                    hideTooltips();
                }).catch(function(error) {
                    console.error(`Помилка завантаження PDF ${currentPdf}:`, error);
                    mainContent.innerHTML = `
                        <div class="error-message">
                            <p>Не вдалося завантажити каталог ${currentPdf.toUpperCase()}</p>
                            <small>${error.message || 'Перевірте підключення до інтернету'}</small>
                        </div>
                    `;
                    updateNavigation();
                    hideTooltips();
                });
            });
        }

        function preloadPages(startPage, count) {
            if (!pdfDoc) return;
            console.log(`Попереднє завантаження ${count} сторінок, починаючи зі сторінки ${startPage}.`);
            for (let i = startPage; i < startPage + count && i <= pdfDoc.numPages; i++) {
                if (!pageCache.has(i)) {
                    pdfDoc.getPage(i).then(function(page) {
                        pageCache.set(i, page);
                        console.log(`Сторінка ${i} попередньо завантажена.`);
                    }).catch(function(error) {
                        console.error(`Помилка попереднього завантаження сторінки ${i}:`, error);
                    });
                }
            }
        }

        function renderPage(num) {
            if (!pdfDoc) return;
            pageRendering = true;
            console.log(`Відображення сторінки: ${num}.`);

            if (pageCache.has(num)) {
                renderPageFromCache(num);
            } else {
                pdfDoc.getPage(num).then(function(page) {
                    pageCache.set(num, page);
                    renderPageFromCache(num);
                    preloadPages(num + 1, preloadNextPages);
                }).catch(function(error) {
                    console.error(`Помилка відображення сторінки ${num}:`, error);
                    pageRendering = false;
                    hideTooltips();
                });
            }
        }

        function renderPageFromCache(num) {
            const page = pageCache.get(num);
            const container = document.querySelector('.pdf-container');
            
            const scale = currentScale === 1.0 ? calculateOptimalScale(page) : currentScale;
            
            const viewport = page.getViewport({ scale: scale });

            const maxWidth = isMobile ? 4096 : 8192;
            const maxHeight = isMobile ? 4096 : 8192;

            let outputScale = Math.min(renderQuality, maxWidth / viewport.width, maxHeight / viewport.height);
            outputScale = Math.min(outputScale, isIOS ? 1.8 : 2.5);

            const targetCanvas = canvasNext;
            const targetCtx = ctxNext;

            targetCanvas.width = Math.floor(viewport.width * outputScale);
            targetCanvas.height = Math.floor(viewport.height * outputScale);

            targetCanvas.style.width = Math.floor(viewport.width) + 'px';
            targetCanvas.style.height = Math.floor(viewport.height) + 'px';

            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

            const renderContext = {
                canvasContext: targetCtx,
                viewport: viewport,
                transform: transform,
                enableWebGL: !isIOS,
                textLayer: false,
                enhanceTextSelection: false,
                useDisplayValues: true
            };

            const renderTask = page.render(renderContext);

            renderTask.promise.then(function() {
                pageRendering = false;
                
                canvas.classList.add('canvas-hidden');
                setTimeout(() => {
                    canvas.width = targetCanvas.width;
                    canvas.height = targetCanvas.height;
                    canvas.style.width = targetCanvas.style.width;
                    canvas.style.height = targetCanvas.style.height;

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(targetCanvas, 0, 0);

                    canvas.classList.remove('canvas-hidden');
                    canvas.classList.add('high-quality');
                    targetCanvas.classList.add('canvas-next');
                }, 50);

                if (pageNumPending !== null) {
                    renderPage(pageNumPending);
                    pageNumPending = null;
                }

                updateNavigation();
                updateFavoriteButton();
                hideTooltips();
            }).catch(function(error) {
                console.error(`Помилка рендерингу сторінки ${num}:`, error);
                pageRendering = false;
                hideTooltips();
            });
        }

        function updateNavigation() {
            if (!pdfDoc) {
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pdfFavoriteBtn.classList.toggle('active', favoritesMode);
                hideTooltips();
                return;
            }

            if (favoritesMode) {
                const favoritePagesList = getFavoritePagesList();
                const currentIndex = favoritePagesList.indexOf(pageNum);

                prevBtn.disabled = currentIndex <= 0;
                nextBtn.disabled = currentIndex >= favoritePagesList.length - 1;
            } else {
                prevBtn.disabled = pageNum <= 1;
                nextBtn.disabled = pageNum >= pdfDoc.numPages;
            }

            pdfFavoriteBtn.classList.toggle('active', favoritesMode);
            hideTooltips();
        }

        function updateFavoriteButton() {
            pdfFavoriteBtn.classList.toggle('active', favoritePages[currentPdf]?.includes(pageNum) || false);
        }

        function clearAllFavorites() {
            if (confirm('Ви впевнені, що хочете видалити всі обрані малюнки?')) {
                favoritePages[currentPdf] = [];
                localStorage.setItem('favoritePages', JSON.stringify(favoritePages));

                if (favoritesMode) {
                    favoritesMode = false;
                    pageNum = 1;
                    queueRenderPage(pageNum);
                }

                updateFavoriteButton();
                pdfFavoriteBtn.classList.remove('active');
                hideTooltips();
            }
        }

        function toggleFavorite() {
            if (!pdfDoc) return;
            if (!favoritePages[currentPdf]) favoritePages[currentPdf] = [];
            const index = favoritePages[currentPdf].indexOf(pageNum);

            if (index === -1) {
                favoritePages[currentPdf].push(pageNum);
                pdfFavoriteBtn.classList.add('active');
            } else {
                favoritePages[currentPdf].splice(index, 1);
                pdfFavoriteBtn.classList.remove('active');
            }

            localStorage.setItem('favoritePages', JSON.stringify(favoritePages));

            if (favoritesMode && index !== -1) {
                const favoritePagesList = getFavoritePagesList();
                if (favoritePagesList.length === 0) {
                    toggleFavoritesView();
                } else {
                    const nextPageIndex = Math.min(index, favoritePagesList.length - 1);
                    pageNum = favoritePagesList[nextPageIndex];
                    queueRenderPage(pageNum);
                }
            }
            hideTooltips();
        }

        function toggleFavoritesView() {
            if (!pdfDoc) return;
            favoritesMode = !favoritesMode;

            if (favoritesMode) {
                const favoritePagesList = getFavoritePagesList();

                if (favoritePagesList.length === 0) {
                    favoritesMode = false;
                    alert('У вас немає обраних сторінок');
                    hideTooltips();
                    return;
                }

                if (!favoritePagesList.includes(pageNum)) {
                    pageNum = favoritePagesList[0];
                    queueRenderPage(pageNum);
                }
            } else {
                pageNum = 1;
                queueRenderPage(pageNum);
            }

            updateNavigation();
            hideTooltips();
        }

        function getFavoritePagesList() {
            return [...(favoritePages[currentPdf] || [])].sort((a, b) => a - b);
        }

        function sharePage() {
            if (!pdfDoc) return;
            const pageUrl = window.location.href.split('#')[0] + '#page=' + pageNum + '&pdf=' + currentPdf;

            if (navigator.share) {
                navigator.share({
                    title: 'TD MELNYK - ' + currentPdf.toUpperCase() + ' - Сторінка ' + pageNum,
                    url: pageUrl
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(pageUrl).then(function() {
                    alert('Посилання на сторінку скопійовано в буфер обміну!');
                }).catch(function() {
                    const tempInput = document.createElement('input');
                    tempInput.value = pageUrl;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                    alert('Посилання на сторінку скопійовано в буфер обміну!');
                });
            }
            hideTooltips();
        }

        function queueRenderPage(num) {
            if (!pdfDoc) return;
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
            hideTooltips();
        }

        function prevPage() {
            if (!pdfDoc) return;
            if (favoritesMode) {
                const favoritePagesList = getFavoritePagesList();
                const currentIndex = favoritePagesList.indexOf(pageNum);
                if (currentIndex > 0) {
                    pageNum = favoritePagesList[currentIndex - 1];
                    queueRenderPage(pageNum);
                }
            } else {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
            }
            hideTooltips();
        }

        function nextPage() {
            if (!pdfDoc) return;
            if (favoritesMode) {
                const favoritePagesList = getFavoritePagesList();
                const currentIndex = favoritePagesList.indexOf(pageNum);
                if (currentIndex < favoritePagesList.length - 1) {
                    pageNum = favoritePagesList[currentIndex + 1];
                    queueRenderPage(pageNum);
                }
            } else {
                if (pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
            }
            hideTooltips();
        }

        function setupThumbnailObserver() {
            const thumbnails = catalogs.map(c => ({ pdfName: c.name, id: `thumbnail-${c.name}` }));

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const thumbnailId = entry.target.id;
                        const pdfName = thumbnails.find(t => t.id === thumbnailId)?.pdfName;
                        if (pdfName && !entry.target.classList.contains('loaded')) {
                            generateThumbnail(pdfName, thumbnailId);
                            entry.target.classList.add('loaded');
                        }
                    }
                });
            }, { root: null, rootMargin: '0px', threshold: 0.1 });

            thumbnails.forEach(thumbnail => {
                const element = document.getElementById(thumbnail.id);
                if (element) observer.observe(element);
            });
        }
        
        function generateSelectionContent() {
            const pdfSelection = document.getElementById('pdfSelection');
            pdfSelection.innerHTML = '';
            catalogs.forEach(catalog => {
                const item = document.createElement('div');
                item.classList.add('pdf-item');
                item.onclick = () => openPdf(catalog.name);
                item.innerHTML = `
                    <div class="pdf-thumbnail" id="thumbnail-${catalog.name}">
                        <div class="thumbnail-placeholder">${catalog.name.toUpperCase()}<br>Каталог</div>
                        <div class="loading-spinner"></div>
                    </div>
                    <div class="pdf-name">${catalog.name.toUpperCase()}</div>
                `;
                pdfSelection.appendChild(item);
            });
        }

        window.addEventListener('load', function() {
            setTimeout(() => {
                document.querySelector('.loader').style.display = 'none';
                if (mainTooltip) {
                    mainTooltip.style.display = 'block';
                }
            }, 2000);

            generateSelectionContent();
            setupThumbnailObserver();

            const hash = window.location.hash;
            if (hash && hash.includes('page=') && hash.includes('pdf=')) {
                const params = new URLSearchParams(hash.substring(1));
                const page = parseInt(params.get('page'));
                const pdfName = params.get('pdf');
                if (!isNaN(page) && page > 0 && catalogs.find(c => c.name === pdfName)) {
                    pageNum = page;
                    openPdf(pdfName);
                }
            }
            hideTooltips();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                if (mainContent.style.display === 'flex') {
                    prevPage();
                }
            } else if (e.key === 'ArrowRight') {
                if (mainContent.style.display === 'flex') {
                    nextPage();
                }
            } else if (e.key === 'End') {
                if (!favoritesMode && pdfDoc) {
                    pageNum = pdfDoc.numPages;
                    queueRenderPage(pageNum);
                }
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFavorite();
            } else if (e.key === 's' || e.key === 'S') {
                sharePage();
            } else if (e.key === 'Escape') {
                if (mainContent.style.display === 'flex') {
                    goBackToMainMenu();
                } else if (favoritesModal.style.display === 'flex') {
                    closeFavoritesModal();
                }
            }
        });

        let resizeTimeout;

        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (pdfDoc && !pageRendering) {
                    const newIsMobile = window.innerWidth <= 767;
                    renderQuality = newIsMobile ? Math.min(window.devicePixelRatio || 1, 2.5) : Math.min(window.devicePixelRatio || 1, 1.5);
                    renderPage(pageNum);
                    hideTooltips();
                }
                if (mainMenu.style.display === 'flex') {
                    generateSelectionContent();
                    setupThumbnailObserver();
                }
            }, 100);
        });
        
        const pdfContainer = document.querySelector('.pdf-container');
        let initialPinchDistance = null;
        let initialCanvasWidth = 0;

        pdfContainer.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                initialCanvasWidth = canvas.offsetWidth;
            }
        }, { passive: false });

        pdfContainer.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const currentPinchDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                if (initialPinchDistance) {
                    let scaleFactor = currentPinchDistance / initialPinchDistance;
                    let newWidth = initialCanvasWidth * scaleFactor;
                    
                    const originalWidth = canvas.width / (renderQuality || 1);
                    const originalHeight = canvas.height / (renderQuality || 1);
                    const viewportRatio = originalWidth / originalHeight;
                    
                    const newHeight = newWidth / viewportRatio;

                    const minScale = 1.0;
                    const maxScale = isMobile ? 3.0 : 2.0;
                    
                    if (scaleFactor > maxScale) {
                        scaleFactor = maxScale;
                    } else if (scaleFactor < minScale) {
                        scaleFactor = minScale;
                    }
                    
                    canvas.style.width = (initialCanvasWidth * scaleFactor) + 'px';
                    canvas.style.height = (initialCanvasWidth * scaleFactor / viewportRatio) + 'px';
                }
            }
        }, { passive: false });

        pdfContainer.addEventListener('touchend', function(e) {
            initialPinchDistance = null;
            const newScale = canvas.offsetWidth / initialCanvasWidth;
            currentScale = newScale;
        });

        let touchStartX = 0;
        let touchStartTime = 0;
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartTime = Date.now();
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (e.changedTouches.length === 1) {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndTime = Date.now();
                const deltaX = touchEndX - touchStartX;
                const deltaTime = touchEndTime - touchStartTime;
                
                // Перевірка на свайп, лише якщо не відбувається масштабування
                if (deltaTime < 300 && Math.abs(deltaX) > 50 && Math.abs(currentScale - 1.0) < 0.01) {
                    if (deltaX > 0) {
                        prevPage();
                    } else {
                        nextPage();
                    }
                }
            }
        }, { passive: true });

        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' && !e.shiftKey) {
                e.preventDefault();
                nextPage();
            } else if (e.key === ' ' && e.shiftKey) {
                e.preventDefault();
                prevPage();
            }
        });

        function setAppHeight() {
            document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
        }

        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', function() {
            setTimeout(setAppHeight, 300);
            if (pdfDoc && !pageRendering) {
                setTimeout(function() {
                    renderPage(pageNum);
                    hideTooltips();
                }, 350);
            }
        });
        setAppHeight();
    </script>
</body>
</html>
